[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "trustnet"
version = "0.1.0"
description = "TrustNet: A framework for trustworthy and multimodal AI systems"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
