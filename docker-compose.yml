services:
  # GPU-enabled profile (NVIDIA Container Toolkit required on host)
  trustnet-api-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: nvidia/cuda:12.6.0-runtime-ubuntu22.04
    container_name: trustnet_api_gpu
    profiles: ["gpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - TRUSTNET_API_KEYS=${TRUSTNET_API_KEYS}
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data:ro
      - hf_cache:/home/appuser/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU-fallback profile for development or environments without NVIDIA GPUs
  trustnet-api-cpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: python:3.11-slim-bookworm
    container_name: trustnet_api_cpu
    profiles: ["cpu"]
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=development
      - TRUSTNET_API_KEYS=${TRUSTNET_API_KEYS}
    volumes:
      - ./outputs:/app/outputs
      - ./data:/app/data:ro
      - hf_cache:/home/appuser/.cache/huggingface

volumes:
  hf_cache:
    name: trustnet_hf_cache
